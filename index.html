<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Compliment Generator</title>

  <!-- Google Fonts: Nunito (for compliments) & Lato (for UI/buttons) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Nunito:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

  <!-- Link to external stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Main container centered on the page -->
  <main class="card">
    <div class="quote-icon">“</div>
    
    <!-- Display area for the random compliment -->
    <p id="compliment-text" class="compliment-text">
      Click the button below to receive your compliment!
    </p>

    <!-- Trigger button to generate new compliments -->
    <button id="generate-btn" class="btn">Get a New Compliment</button>
  </main>

  <!-- Link to external JavaScript file -->
  <script src="script.js"></script>
</body>
</html>
