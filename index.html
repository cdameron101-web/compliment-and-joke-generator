<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Compliment Generator</title>

  <!-- Google Fonts: Nunito (for compliments) & Lato (for UI/buttons) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Nunito:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- Link to external stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card" role="main">
    <div class="card-actions" aria-label="Content actions">
      <button id="favorite-btn" class="icon-btn" type="button" aria-pressed="false" aria-label="Favorite this item">&#10084; Favorite</button>
      <button id="copy-btn" class="icon-btn" type="button" aria-label="Copy this item">Copy</button>
      <button id="share-btn" class="icon-btn" type="button" aria-label="Share this item">Share</button>
    </div>

    <div class="mode-switch" role="tablist" aria-label="Choose content type">
      <button id="compliment-mode-btn" class="mode-btn is-active" type="button" data-mode="compliment">Compliments</button>
      <button id="joke-mode-btn" class="mode-btn" type="button" data-mode="joke">Jokes</button>
    </div>

    <div class="quote-icon">&#8220;</div>

    <p id="content-text" class="compliment-text" aria-live="polite">
      Click the button below to receive your compliment!
    </p>
    <p id="punchline-text" class="punchline-text" hidden></p>

    <div class="button-row">
      <button id="generate-btn" class="btn" type="button">Get a New One</button>
      <button id="favorites-toggle-btn" class="btn btn--secondary" type="button">View Favorites</button>
    </div>

    <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
  </main>

  <section id="favorites-panel" class="favorites-panel" aria-hidden="true">
    <div class="favorites-panel__backdrop" data-close="true"></div>
    <div class="favorites-panel__content" role="dialog" aria-modal="true" aria-labelledby="favorites-title">
      <div class="favorites-panel__header">
        <h2 id="favorites-title">Saved Favorites</h2>
        <button id="close-favorites-btn" class="icon-btn" type="button" aria-label="Close favorites">Close</button>
      </div>
      <ul id="favorites-list" class="favorites-list"></ul>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
