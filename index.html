<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Compliment Generator</title>

  <!-- Google Fonts: Nunito (for compliments) & Lato (for UI/buttons) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Nunito:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

  <!-- Link to external stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card" role="main">
    <div class="card-actions" aria-label="Compliment actions">
      <button id="favorite-btn" class="icon-btn" type="button" aria-pressed="false" aria-label="Favorite this compliment">♡ Favorite</button>
      <button id="copy-btn" class="icon-btn" type="button" aria-label="Copy this compliment">Copy</button>
      <button id="share-btn" class="icon-btn" type="button" aria-label="Share this compliment">Share</button>
    </div>

    <div class="quote-icon">“</div>

    <p id="compliment-text" class="compliment-text" aria-live="polite">
      Click the button below to receive your compliment!
    </p>

    <div class="button-row">
      <button id="generate-btn" class="btn" type="button">Get a New Compliment</button>
      <button id="favorites-toggle-btn" class="btn btn--secondary" type="button">View Favorites</button>
    </div>

    <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
  </main>

  <section id="favorites-panel" class="favorites-panel" aria-hidden="true">
    <div class="favorites-panel__backdrop" data-close="true"></div>
    <div class="favorites-panel__content" role="dialog" aria-modal="true" aria-labelledby="favorites-title">
      <div class="favorites-panel__header">
        <h2 id="favorites-title">Saved Favorites</h2>
        <button id="close-favorites-btn" class="icon-btn" type="button" aria-label="Close favorites">Close</button>
      </div>
      <ul id="favorites-list" class="favorites-list"></ul>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
